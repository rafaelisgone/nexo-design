<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nexo Design — Cursos online de UX</title>
<meta name="description" content="Aprenda UX no seu ritmo: cursos online em português, do básico ao avançado, com aulas curtas e certificado de conclusão.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FBF8F3;--fg:#1C1B22;--card:#fff;--pri:#0B5D5B;--pri-h:#084644;--pri-s:#E3EFEC;--sec:#EDE7DD;--mut:#57534E;--acc:#F2C14E;--ok:#1D6B34;--ok-s:#E4F2E8;--err:#B42318;--err-s:#FBE9E7;--bd:#E5DFD3;--inp:#8A8378;--r:12px}
*{box-sizing:border-box;border-color:var(--bd)}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font:400 1rem/1.6 "Atkinson Hyperlegible",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
h1,h2,h3{font-family:"Bricolage Grotesque",system-ui,sans-serif;margin:0}
.d{font-weight:700;font-size:clamp(2rem,1.35rem + 2.6vw,3.25rem);line-height:1.1;letter-spacing:-.02em}
.h{font-weight:600;font-size:clamp(1.375rem,1.2rem + .6vw,1.75rem);line-height:1.25}
.hl{background-image:linear-gradient(transparent 58%,var(--acc) 58%,var(--acc) 92%,transparent 92%);padding-inline:.1em}
.w{max-width:72rem;margin:0 auto;padding:0 1rem}
.n{max-width:48rem;margin:0 auto;padding:2rem 1rem 3rem}
.mut{color:var(--mut)}.b{font-weight:700}.mt{margin-top:1rem}.mt2{margin-top:2rem}
a{color:var(--pri)}
.skip{position:absolute;left:-999px;background:var(--fg);color:#fff;padding:.5rem 1rem;z-index:99}.skip:focus{left:1rem;top:1rem}
header{position:sticky;top:0;z-index:40;background:rgba(251,248,243,.95);backdrop-filter:blur(6px);border-bottom:1px solid var(--bd)}
header .w{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding-block:.5rem;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:.5rem;min-height:44px;font:700 1.25rem "Bricolage Grotesque",sans-serif;color:var(--fg);text-decoration:none}
.logo span{display:grid;place-items:center;width:32px;height:32px;border-radius:8px;background:var(--pri);color:#fff}
nav ul{display:flex;gap:.25rem;list-style:none;margin:0;padding:0;flex-wrap:wrap;align-items:center}
nav a.l{display:inline-flex;align-items:center;min-height:44px;padding:0 1rem;border-radius:8px;font-weight:700;color:var(--fg);text-decoration:none}
nav a.l:hover{background:var(--sec)}nav a.l[aria-current]{color:var(--pri);text-decoration:underline;text-underline-offset:8px;text-decoration-thickness:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:44px;padding:0 1.25rem;border-radius:10px;border:2px solid var(--pri);background:var(--pri);color:#fff;font:700 1rem inherit;font-family:inherit;text-decoration:none;cursor:pointer}
.btn:hover{background:var(--pri-h)}.btn.o{background:transparent;color:var(--pri)}.btn.o:hover{background:var(--pri-s)}
.btn.s{background:var(--sec);border-color:var(--sec);color:var(--fg)}.btn.lg{min-height:52px;padding:0 1.75rem}.btn.g{background:transparent;border-color:transparent;color:var(--fg)}
.btn:disabled{background:#D6D3CE;border-color:#D6D3CE;color:#5F5A54;cursor:not-allowed}
.grid{display:grid;gap:1.5rem}.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,19rem),1fr))}
.hero{display:grid;gap:2.5rem;align-items:center;padding-block:3rem;grid-template-columns:repeat(auto-fit,minmax(min(100%,22rem),1fr))}
.hero img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:24px;box-shadow:0 2px 4px #0001,0 18px 40px -16px #0B5D5B59}
.pill{display:inline-block;border-radius:99px;background:var(--pri-s);color:var(--pri);padding:.2rem .75rem;font-size:.875rem;font-weight:700}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:1.5rem;box-shadow:0 1px 2px #1c1b2210}
.card h3{font-size:1.125rem;font-weight:700;margin:.5rem 0 .25rem}
.band{background:var(--card);border-block:1px solid var(--bd)}.band ul{list-style:none;display:flex;flex-wrap:wrap;gap:1rem 2rem;margin:0;padding:1.25rem 1rem}.band li{font-weight:700}
.sec{background:var(--sec)}section.s{padding:3.5rem 0}
.lv{display:inline-block;border-radius:6px;padding:.1rem .6rem;font-size:.875rem;font-weight:700}
.lv.iniciante{background:var(--ok-s);color:var(--ok)}.lv.intermediario{background:#FDF3D7;color:#6B4E00}.lv.avancado{background:var(--pri-s);color:var(--pri)}
.cta{background:var(--pri);color:#fff;border-radius:24px;padding:2rem;display:flex;flex-wrap:wrap;gap:1.5rem;justify-content:space-between;align-items:center}
.lvl{display:flex;flex-direction:column;height:100%;border:2px solid var(--bd);border-radius:16px;background:var(--card);padding:1.25rem;color:var(--fg);text-decoration:none;font-weight:700}.lvl:hover{border-color:var(--pri)}
.crumb{font-size:.9rem;color:var(--mut)}.crumb a{color:var(--mut)}
details{border-bottom:1px solid var(--bd)}summary{min-height:44px;display:flex;align-items:center;font-weight:700;cursor:pointer;padding:.5rem 0}details p{margin:0 0 1rem}
label{display:block;font-weight:700;margin:1rem 0 .25rem}
input,select{width:100%;min-height:44px;padding:.5rem .75rem;border:2px solid var(--inp);border-radius:8px;background:#fff;font:inherit;color:var(--fg)}
input[aria-invalid=true]{border-color:var(--err)}.err{color:var(--err);font-size:.9rem;margin:.25rem 0 0}
.box{border-radius:12px;padding:1rem;margin-top:1rem}.box.ok{background:var(--ok-s);color:#14502A}.box.er{background:var(--err-s);color:var(--err)}.box.in{background:var(--pri-s)}
.opt{display:flex;gap:.75rem;align-items:center;border:2px solid var(--bd);border-radius:12px;padding:.75rem 1rem;margin-top:.5rem;cursor:pointer;background:#fff}.opt input{width:auto;min-height:0}
ul.p{padding-left:1.25rem}
footer{background:var(--sec);border-top:1px solid var(--bd);margin-top:2rem}footer .w{padding-block:1.5rem;display:flex;flex-wrap:wrap;gap:1rem;justify-content:space-between;align-items:center}
.tabs{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:1rem}.tabs button{min-height:44px;border:2px solid var(--bd);background:#fff;border-radius:99px;padding:0 1rem;font:700 1rem inherit;font-family:inherit;cursor:pointer}.tabs button[aria-pressed=true]{background:var(--pri);color:#fff;border-color:var(--pri)}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,15rem),1fr))}
.bar{height:10px;border-radius:99px;background:var(--sec);overflow:hidden;margin-top:.75rem}.bar span{display:block;height:100%;background:var(--pri)}
.steps{display:flex;gap:.5rem;list-style:none;padding:0;margin:1rem 0;flex-wrap:wrap}.steps li{padding:.25rem .75rem;border-radius:99px;background:var(--sec);font-size:.9rem;font-weight:700;color:var(--mut)}.steps li[aria-current]{background:var(--pri);color:#fff}
.cert{border:6px double var(--pri);border-radius:16px;background:#fff;padding:3rem 1.5rem;text-align:center}.cert .nm{font:700 2rem "Bricolage Grotesque",sans-serif;margin:.5rem 0;color:var(--pri)}
code{word-break:break-all;display:block;background:var(--sec);padding:.75rem;border-radius:8px;margin-top:1rem}
caption{font-family:"Bricolage Grotesque",sans-serif;font-size:1.125rem}
.big{font-size:1.125rem;line-height:1.75}ul.big li,ol.big li{margin-bottom:.4rem}
@media print{header,footer,.np,.skip{display:none!important}body{background:#fff}}
</style>

{s:"ux-do-zero",t:"UX do Zero",r:"Entenda o que é UX e como o processo funciona, passo a passo.",l:"iniciante",w:"Para quem nunca estudou UX ou está mudando de área.",d:"Um curso de introdução para entender como produtos digitais são pensados. Você aprende o vocabulário, o processo e as ferramentas básicas de UX, sem precisar de experiência anterior.",pr:"Nenhum. Basta ter um computador e vontade de aprender.",p:29700,
o:["Explicar a diferença entre UX e UI","Usar o Double Diamond para organizar um trabalho","Criar matriz CSD, personas e jornada do usuário","Avaliar telas com as 10 regras de usabilidade de Nielsen"],
m:[["Primeiros passos",[
["O que é UX (e o que não é)",10,"UX vem de User Experience, ou experiência do usuário. Ela abrange tudo o que a pessoa sente e vive ao usar um produto, desde o momento em que percebe que precisa dele até depois de usá-lo. Um app pode ter tudo funcionando e ainda assim ser cansativo, confuso ou frustrante, e é aí que o UX entra.||Pense numa porta que você empurra quando deveria puxar. A porta funciona, mas o design falhou. UX é fazer com que o produto seja fácil, útil e agradável para as pessoas, e não só correto para quem o programou.","Liste 3 apps que você usa e o que torna cada um fácil ou difícil."],
["UX e UI: qual a diferença?",8,"Muita gente confunde as duas siglas. UI, de User Interface, é a interface: botões, cores, fontes e ícones, ou seja, o que você vê na tela. UX é a experiência completa: se foi fácil achar o que precisava, se entendeu o que aconteceu e como se sentiu no caminho.||Uma boa imagem para lembrar é a de uma ponte. A UI é a ponte que o usuário enxerga. A UX é como ele se sente ao atravessá-la: com segurança e rapidez, ou com medo e dúvidas. Uma tela bonita não garante uma boa experiência.","Compare a tela inicial de dois apps de banco."],
["O processo Double Diamond",12,"O Double Diamond, ou Duplo Diamante, é um método para não começar um projeto no escuro. Ele tem quatro fases: descobrir, definir, desenvolver e entregar. Em cada diamante, primeiro abrimos as possibilidades (pesquisar e ter ideias) e depois as fechamos (escolher o que faz mais sentido).||Na prática: em Descobrir você conversa com as pessoas e observa o problema real. Em Definir escolhe qual problema resolver. Em Desenvolver cria soluções e rascunhos. Em Entregar testa com usuários e ajusta. O processo se repete sempre que for preciso melhorar.","Desenhe o processo com suas palavras."],
["As 10 regras de usabilidade de Nielsen",15,"Jakob Nielsen é um especialista em usabilidade que reuniu 10 regras para avaliar interfaces. Elas funcionam como uma lista de verificação: mostrar o que está acontecendo, falar a língua do usuário, permitir desfazer, manter padrões, evitar erros e oferecer ajuda são alguns exemplos.||Quando um especialista analisa uma tela usando essas regras, isso se chama avaliação heurística. Por exemplo: se você envia um formulário e nada aparece na tela, a regra de visibilidade do status foi quebrada, porque você não sabe se deu certo. Essas regras ajudam a achar problemas antes de testar com pessoas.","Escolha um site e encontre um problema ligado a uma das regras."]]],
["Conhecer as pessoas",[
["Pesquisa de mesa",10,"Desk research, ou pesquisa de mesa, é reunir informações que já existem, sem precisar sair a campo conversando com as pessoas. Ela é rápida e barata. Dá para usar relatórios da empresa, dados do IBGE, notícias, avaliações de apps nas lojas e comentários em redes sociais.||O objetivo é entender o contexto e não reinventar a roda. Se você vai criar um app para idosos, pesquisar antes quantos idosos usam smartphone já responde várias dúvidas. Também vale olhar os concorrentes: o que eles fazem bem e onde as pessoas reclamam.","Encontre 3 dados sobre o público de um app."],
["Matriz CSD",12,"A Matriz CSD organiza o conhecimento da equipe em três colunas. Certezas são fatos comprovados, como dados e requisitos. Suposições são hipóteses que acreditamos serem verdadeiras, mas não foram confirmadas. Dúvidas são as perguntas que ainda não sabemos responder.||Ela evita que a equipe trate “achismo” como verdade. Um exemplo: “jovens não gostam de formulários longos” é uma suposição, e não uma certeza. As suposições e as dúvidas viram o roteiro da pesquisa, e o trabalho é transformá-las em certezas com dados e conversas.","Preencha a matriz para um app de aluguel de bicicletas."],
["Personas",12,"Persona é um personagem que resume o comportamento de um grupo de usuários reais. Ela não é “mulheres de 25 a 35 anos”, e sim alguém com nome, rotina, objetivos e dores, como a Ana, advogada, com pouco tempo e ansiosa com burocracia.||Uma persona útil traz só o que influencia o uso do produto. Que ela tem um gato não importa; que esquece senhas com frequência, importa. Sempre que surgir uma dúvida no design, vale perguntar: a Ana entenderia isso? Assim a persona ajuda a decidir, e não fica só como enfeite.","Crie uma persona com nome, rotina e 3 dores."],
["Jornada do usuário",14,"A jornada do usuário é um mapa que mostra, passo a passo, o que a pessoa faz, pensa e sente ao tentar resolver uma tarefa. Ela é dividida em fases (descobrir, comparar, comprar, usar), e em cada fase aparecem as ações, os pontos de contato e as emoções.||Um gráfico de humor mostra os altos e baixos da experiência. O ponto mais baixo é onde a pessoa quase desiste e onde há mais oportunidade de melhorar. Repare que a jornada começa antes do app: ao pedir um carro, ela começa quando você percebe que vai se atrasar.","Desenhe a jornada de pedir comida por app."]]],
["Criar e melhorar",[
["Fluxo de telas",10,"O fluxo de telas é um diagrama que mostra o caminho que a pessoa percorre para completar uma tarefa. Usamos formas simples: ovais para início e fim, retângulos para telas, losangos para decisões e setas para a direção.||O “caminho feliz” é quando tudo dá certo. Mas um bom designer também desenha os caminhos de erro: e se a senha estiver errada, a internet cair ou o cartão for recusado? Desenhar o fluxo antes das telas ajuda a descobrir telas esquecidas, como a de “esqueci minha senha”.","Desenhe o fluxo de redefinir uma senha."],
["Rascunhos de tela (wireframes)",12,"Wireframe é o esqueleto de uma tela: mostra onde ficam os blocos de informação, sem cores, fontes ou imagens finais. Um retângulo com um X representa uma imagem, linhas representam textos e retângulos com palavras representam botões.||A ideia é errar rápido e barato. É muito mais fácil descartar um desenho de um minuto do que uma tela digital que levou horas. Um teste simples: se você tirar cores e imagens, ainda dá para saber qual é a ação principal da tela? Se não, a hierarquia precisa melhorar.","Faça 8 rascunhos de uma mesma tela em 8 minutos."],
["Palavras que ajudam (UX writing)",10,"UX writing é o design feito com palavras. Os textos de botões, mensagens de erro e legendas, chamados de microcopy, parecem pequenos, mas decidem se a pessoa entende o que fazer. Um bom texto é claro, curto e útil.||Compare “Dados inválidos” com “Digite um e-mail válido, como nome@email.com”. A segunda diz o que houve e como resolver. O mesmo vale para botões: “Finalizar agendamento” explica melhor o que vai acontecer do que “Enviar”. O tom pode mudar conforme a situação, mas a voz da marca continua a mesma.","Reescreva uma mensagem de erro genérica."],
["Testar com pessoas",14,"No teste de usabilidade, você observa pessoas reais tentando cumprir tarefas na sua tela. O foco não é perguntar “você gostou?”, e sim ver se a pessoa conseguiu. Dê uma missão clara, como “encontre um tênis azul número 40 e coloque no carrinho”, e não ajude.||Peça para ela pensar em voz alta e anote onde hesitou ou errou. Se o usuário não conseguiu usar, o erro é do design, nunca dele. Medir se a tarefa foi concluída, quanto tempo levou e quantos erros ocorreram mostra o que corrigir primeiro.","Peça a um amigo para fazer uma tarefa e anote as hesitações."]]]]},
{s:"ux-research-na-pratica",t:"UX Research na Prática",r:"Planeje entrevistas, observe pessoas e transforme o que ouviu em decisões.",l:"intermediario",w:"Para quem já conhece o básico e quer pesquisar com usuários.",d:"Aprenda a planejar uma pesquisa, conversar com usuários sem induzir respostas e transformar o que ouviu em decisões claras para o produto.",pr:"Conhecer o básico de UX, como o que é persona e jornada.",p:34700,
o:["Escrever roteiros de entrevista sem perguntas que induzem","Escolher entre pesquisa qualitativa e quantitativa","Organizar anotações em padrões e insights","Medir a experiência com métricas de UX"],
m:[["Planejar a pesquisa",[
["Que pergunta queremos responder?",10,"Toda boa pesquisa começa com uma pergunta clara. Sem ela, é fácil sair conversando com as pessoas e voltar com muitas informações que não ajudam a decidir nada. A pergunta deve ser específica e ligada a uma decisão do projeto.||Compare: “O que as pessoas acham do nosso app?” é vaga demais. Já “Por que os usuários abandonam o cadastro antes de terminar?” indica onde olhar. Use a matriz CSD: as dúvidas e suposições da equipe são ótimas fontes de perguntas de pesquisa.","Escreva a pergunta de pesquisa para um app de estudos."],
["Qualitativa ou quantitativa?",12,"A pesquisa quantitativa trabalha com números e responde “quanto” e “quantas vezes”, como “60% dos usuários preferem pagar com Pix”. A qualitativa trabalha com conversas e observação e responde “como” e “por quê”.||Um formulário mostra o que está acontecendo, mas raramente explica o motivo. Por isso, os dois métodos se completam. Use pesquisa quantitativa para medir uma tendência em muita gente e a qualitativa para entender a fundo o comportamento de poucas pessoas. Juntas, dão uma visão de 360 graus.","Classifique 5 perguntas como qualitativas ou quantitativas."],
["Quem vamos ouvir? O questionário de triagem",12,"Antes de entrevistar, é preciso encontrar as pessoas certas. Entrevistar um amigo ou um familiar costuma dar respostas “educadas”, que não refletem o uso real. O questionário de triagem, ou screener, filtra quem faz parte do público do projeto.||Ele pergunta coisas como idade, hábitos e frequência de uso do produto ou do problema em questão. Exemplo: para um app de bicicletas para idosos, você pode perguntar quem tem mais de 60 anos e anda de bicicleta pelo menos uma vez por mês. Evite perguntas que deixam óbvia a resposta “certa”, porque elas atrapalham a seleção.","Escreva 4 perguntas de triagem."],
["Ética e consentimento",8,"Pesquisar com pessoas exige respeito. No início da entrevista, explique o objetivo, diga que a participação é voluntária e peça permissão antes de gravar áudio ou vídeo. Garanta que a identidade será protegida e que os dados serão usados só para a pesquisa.||Isso também melhora o resultado: quando a pessoa se sente segura, fala com mais honestidade. Deixe claro que não existe resposta certa ou errada, e que o que está sendo avaliado é o produto, e não ela. Se a pessoa quiser parar, ela pode, a qualquer momento.","Escreva o texto de abertura de uma entrevista."]]],
["Ouvir os usuários",[
["Roteiro de entrevista",14,"O roteiro de uma entrevista semiestruturada é um guia, e não um questionário rígido. Ele permite seguir caminhos interessantes que surgirem na conversa. Siga uma ordem: introdução e ética, aquecimento, perguntas principais e fechamento.||No aquecimento, faça perguntas fáceis sobre a rotina da pessoa. No “prato principal”, investigue dores, motivações e comportamentos ligados ao tema. No fim, pergunte se ela quer acrescentar algo que não foi perguntado. Esse espaço final costuma render ótimos insights.","Monte um roteiro com 6 perguntas."],
["Como não induzir respostas",12,"Perguntas indutivas empurram a pessoa para a resposta que você quer ouvir. “Você acha difícil usar este botão?” já sugere que é difícil. Prefira “O que você pensa sobre este botão?”.||Também evite perguntas de sim ou não, que rendem pouco. Em vez de “Você gosta de viajar?”, peça “Conte como foi sua última viagem”. Histórias reais revelam comportamentos que as opiniões escondem. E lembre: o objetivo é descobrir, e não vender a sua ideia durante a entrevista.","Reescreva 5 perguntas induzidas."],
["Escuta ativa",10,"Escuta ativa é prestar atenção de verdade no que a pessoa diz e como diz. Isso inclui não interromper, acenar, repetir uma palavra-chave para incentivar a continuar e perguntar “Pode me contar mais sobre isso?”.||O silêncio é uma ferramenta poderosa. Muitas vezes o melhor insight vem depois de uma pausa, quando a pessoa reflete e completa o raciocínio. Em vez de anotar tudo, grave com permissão e anote só palavras-chave, para manter o contato visual e a conexão com quem fala.","Converse 5 minutos com alguém sem interromper."],
["Observação em contexto",12,"Observar a pessoa usando o produto no ambiente real revela o comportamento implícito, aquilo que ela faz mas não sabe explicar. É assim que se descobrem as “gambiarras” que o usuário inventa para driblar problemas do sistema.||Fique atento a expressões de dúvida ou frustração, ao tempo de hesitação antes de clicar e ao ambiente: a pessoa está sendo interrompida, usando o app com uma mão só ou sob o sol? Esses detalhes mudam decisões de design e dificilmente aparecem em um formulário.","Observe alguém usando um app por 5 minutos e anote."]]],
["Transformar em decisões",[
["Organizar as anotações",12,"Depois das entrevistas, você terá muitas notas, falas e observações. O trabalho é transformar esse volume em padrões. Uma técnica é escrever cada fala em um post-it e agrupar as que são parecidas, formando temas.||Quando várias pessoas relatam o mesmo problema, há um padrão. Se três pessoas disseram que esquecem a senha, isso aponta para uma necessidade real. Dê um nome a cada grupo e evite misturar opinião própria com o que foi dito. Esse mapa de afinidade é a base para os insights e para a criação de personas.","Agrupe 15 frases em temas."],
["Card sorting",12,"O card sorting mostra como as pessoas organizam as informações na cabeça, o que chamamos de modelo mental. Cada item do site vira um cartão, e o participante agrupa e nomeia as categorias.||No card sorting aberto, a pessoa cria os nomes dos grupos. No fechado, ela encaixa os cartões em categorias que você já definiu. No híbrido, usa as categorias prontas, mas pode criar novas. Se muitas pessoas colocam um item em lugares diferentes, o menu precisa de um nome mais claro ou de uma busca melhor.","Faça com 12 itens de um supermercado."],
["Do insight à ação",10,"Um insight não é só um dado. É a explicação de um comportamento que aponta para uma oportunidade. “70% abandonam o carrinho” é um dado. “Abandonam porque o frete só aparece no fim e isso gera desconfiança” é um insight.||Uma boa forma de escrever é: “Percebemos que [pessoas] fazem [comportamento] porque [motivo]. Isso nos dá a oportunidade de [ação]”. Insights bem escritos ajudam a priorizar o que fazer e convencem os times e os gestores a agir.","Escreva 3 insights em uma frase cada."],
["Medir a experiência",14,"Para saber se a experiência melhorou, é preciso medir. Métricas de desempenho incluem a taxa de sucesso da tarefa, o tempo para concluí-la e a taxa de erro. Métricas de atitude vêm do que a pessoa diz, como o SUS, um questionário de usabilidade, e o NPS, que mede o quanto ela recomendaria o produto.||O framework HEART, do Google, organiza isso em felicidade, engajamento, adoção, retenção e sucesso na tarefa. Os números mostram o que acontece, e a pesquisa qualitativa explica por quê. Por isso, usar os dois juntos é o melhor caminho.","Escolha 2 métricas para um app de entrega."]]]]},
{s:"design-system-acessivel",t:"Design System Acessível no Figma",r:"Crie componentes reutilizáveis que qualquer pessoa consegue usar.",l:"avancado",w:"Para quem já projeta telas e quer ganhar consistência.",d:"Entenda como organizar cores, textos e componentes em um sistema único e como garantir que tudo seja utilizável por pessoas com diferentes necessidades.",pr:"Saber usar o Figma e já ter desenhado algumas telas.",p:39700,
o:["Escolher cores com contraste suficiente para leitura","Desenhar componentes com todos os estados (normal, foco, erro)","Aplicar os 4 princípios de acessibilidade da WCAG","Documentar o sistema para o time usar"],
m:[["Base do sistema",[
["O que é um design system",10,"Um design system é uma biblioteca viva de regras e componentes reutilizáveis, como um conjunto de peças de LEGO. Em vez de criar um botão novo a cada tela, você define um padrão e o reutiliza em todo o produto.||Isso traz consistência, o que gera confiança no usuário, e economiza tempo: o designer gasta menos tempo escolhendo “qual azul usar” e mais tempo resolvendo o problema. Um design system reúne tipografia, cores, espaçamentos, componentes e as regras de quando usar cada um.","Liste 5 peças que se repetem em um app."],
["Cores e contraste",12,"Escolher cores não é só questão de gosto. O texto precisa ter contraste suficiente com o fundo para ser lido por pessoas com baixa visão, daltonismo ou até alguém usando o celular sob o sol. A regra da WCAG pede pelo menos 4,5 para 1 para texto comum.||Uma proporção útil é a 60-30-10: 60% de cor neutra, 30% de cor secundária e 10% de destaque. Também nunca use só a cor para passar uma informação. Um campo com erro, por exemplo, precisa de ícone ou texto além do vermelho. Use um verificador de contraste para confirmar suas combinações.","Teste 3 pares de cores em um verificador de contraste."],
["Tipografia e hierarquia",12,"A tipografia organiza a leitura. Escolha fontes legíveis em tela e defina uma hierarquia clara: título (H1), subtítulo (H2) e texto de apoio. O tamanho, o peso e o espaço entre as linhas guiam o olhar para o que é mais importante.||Poucas decisões bem tomadas valem mais do que muitas fontes. Defina uma escala de tamanhos e use-a sempre. Isso ajuda também quem usa leitor de tela, porque os cabeçalhos corretos (H1, H2, H3) mostram a estrutura da página.","Defina título, subtítulo e texto de apoio."],
["Espaçamento e grade",10,"O espaçamento faz a tela respirar. Em vez de usar valores aleatórios, crie uma escala, como 4, 8, 16, 24 e 32 pixels, e use sempre os mesmos. Assim, os elementos ficam alinhados e o layout parece organizado.||A grade (grid) divide a tela em colunas e ajuda o conteúdo a se adaptar a diferentes tamanhos, do celular ao computador. Isso é a base do design responsivo. Quando o espaço é consistente, o usuário percebe ordem sem nem notar por quê.","Defina uma escala de espaçamento."]]],
["Componentes",[
["Botões e seus estados",14,"Um botão não é uma única imagem: ele tem estados. Normal, com o mouse em cima (hover), em foco (quando navegado pelo teclado), pressionado e desativado. Cada um precisa ser visualmente diferente para dar retorno à pessoa.||O foco é essencial para quem usa o teclado, por isso nunca remova o contorno sem colocar outro no lugar. O botão também deve ter pelo menos 44 por 44 pixels, para ser fácil de tocar com o dedo. E o texto precisa dizer o que vai acontecer, como “Finalizar compra”.","Desenhe os 4 estados de um botão."],
["Campos de formulário",12,"Formulários são onde mais acontecem erros. Um bom campo tem um rótulo sempre visível (e não só um texto de exemplo que some ao digitar), uma dica quando for preciso e uma mensagem de erro clara.||A mensagem deve dizer o problema e como resolver, como “Digite um e-mail válido, como nome@email.com”. Evite apagar o que a pessoa já digitou. Pense nos estados: vazio, preenchido, em foco, com erro e desativado. Quando todos estão no sistema, os formulários ficam consistentes.","Desenhe um campo com estado de erro."],
["Alertas e mensagens",10,"Alertas informam o resultado de uma ação: sucesso, aviso, erro ou informação. Para todos conseguirem entender, combine cor, ícone e texto, e não dependa de uma só dessas coisas.||Uma mensagem de sucesso verde com um ícone de check e o texto “Pagamento aprovado” funciona para quem tem daltonismo e para quem usa leitor de tela. Em erros, seja específico e ofereça uma saída, como tentar outro cartão. O tom deve ser empático e nunca culpar o usuário.","Crie alertas de sucesso, aviso e erro."],
["Montar uma biblioteca no Figma",15,"No Figma, um componente é uma peça que você cria uma vez e reutiliza. Quando você altera o componente principal, todas as cópias nas telas se atualizam. Variantes permitem juntar os estados (normal, hover, erro) em um único componente.||Use nomes claros nas camadas e nos estilos, como “botão/primário/hover”, e evite nomes como “Retângulo 542”. Teste a organização trocando a cor primária no estilo global: se todas as telas mudarem sozinhas, a biblioteca está funcionando como deveria.","Transforme seu botão em componente com variantes."]]],
["Acessibilidade e entrega",[
["Os 4 princípios da acessibilidade",12,"A WCAG é o guia mundial de acessibilidade na web, organizado em quatro princípios, o POUR. Perceptível: a informação pode ser percebida por todos, como imagens com texto alternativo. Operável: dá para usar tudo, inclusive só com o teclado.||Compreensível: textos e mensagens são claros e previsíveis. Robusto: o código funciona com diferentes tecnologias assistivas, como leitores de tela. Acessibilidade não é um favor, é um direito, e ajuda todos: legendas servem a quem é surdo e a quem está num ônibus barulhento.","Dê um exemplo de cada princípio."],
["Navegar só com o teclado",10,"Muitas pessoas não usam mouse: por deficiência motora, por preferência ou por usarem leitor de tela. Por isso tudo o que dá para clicar também precisa funcionar com o teclado, usando Tab para avançar, Shift + Tab para voltar, Enter e Espaço para ativar.||O foco deve estar sempre visível, para a pessoa saber onde está. A ordem de navegação deve seguir a ordem lógica da tela. Um bom teste é largar o mouse e tentar completar uma tarefa só com o teclado: onde você travar, existe uma barreira de acessibilidade.","Navegue em um site usando só o teclado."],
["Tamanho de toque e leitura de tela",10,"Alvos de toque devem ter ao menos 44 por 44 pixels e espaço entre si, para evitar toques errados, algo importante para quem tem tremor nas mãos ou usa o celular com uma mão só.||Leitores de tela leem o código da página em voz alta. Por isso as imagens importantes precisam de texto alternativo, que descreva o que mostram e o que significam. Imagens só decorativas podem ficar sem descrição. Usar os cabeçalhos corretos e rótulos nos campos também faz muita diferença para essas pessoas.","Escreva o texto alternativo de 3 imagens."],
["Documentar para o time",12,"Um design system só funciona se as pessoas souberem usá-lo. A documentação explica para cada componente quando usar, quando não usar, quais são as variantes e os estados, as medidas e as regras de acessibilidade.||Também é útil usar design tokens, nomes que designers e desenvolvedores compartilham, como “cor-primaria” em vez de “aquele azul”. Isso evita erros e facilita a manutenção. Na entrega ao time de desenvolvimento, organize as camadas, mostre os estados e escreva o que acontece em cada interação.","Documente um botão em uma página."]]]]}];
const LV={iniciante:"Iniciante",intermediario:"Intermediário",avancado:"Avançado"};
const DOR=[["Não sei por onde começar","Cada curso diz para quem é e o que você precisa saber antes de comprar."],["Tenho pouco tempo","Aulas de até 15 minutos, que cabem em qualquer pausa do dia."],["Os termos técnicos me assustam","Cada termo é explicado em linguagem simples, com exemplos do dia a dia."],["Quero ver o conteúdo antes de pagar","A lista completa de aulas fica aberta na página do curso, antes de você comprar."]];

const L=c=>c.m.flatMap((m,i)=>m[1].map(a=>({a,mi:i,mod:m[0]})));

const bad=(id,m)=>m?`<p class="err" id="${id}-e">${m}</p>`:"";
const cards=(a,f,cl="g2")=>`<ul class="grid ${cl} mt2" style="list-style:none;padding:0">${a.map(x=>`<li class="card">${f(x)}</li>`).join("")}</ul>`;

const gate=(t,p,next)=>`<div class="n"><h1 class="d" style="font-size:2rem">${t}</h1><p>${p}</p><a class="btn lg" href="#/entrar" onclick="sessionStorage.setItem('nx_next','${next}')">Entrar ou criar conta</a></div>`;
function nav(r){$("#nav").innerHTML=[["cursos","Cursos"],["sobre","Sobre"],["ajuda","Ajuda"]].map(([k,t])=>`<li><a class="l" href="#/${k}" ${r[0]==k?'aria-current="page"':""}>${t}</a></li>`).join("")+(user?`<li><a class="btn o" href="#/meus-cursos">Meus cursos</a></li><li><button class="btn g" id="out">Sair</button></li>`:`<li><a class="btn o" href="#/entrar">Entrar</a></li>`);
const o=$("#out");if(o)o.onclick=()=>{user=null;sv("nx_user",null);location.hash="#/"}}

const V={
"":()=>`<div class="w"><section class="hero" aria-labelledby="ht"><div><p class="pill">Cursos online de UX</p><h1 id="ht" class="d mt">Aprenda UX no seu ritmo, do <span class="hl">básico ao avançado</span></h1><p class="mut mt" style="font-size:1.125rem;max-width:36rem">Aulas curtas em português, exercícios práticos e certificado de conclusão. Escolha o curso pelo seu nível e comece hoje.</p><p class="mt2" style="display:flex;gap:.75rem;flex-wrap:wrap"><a class="btn lg" href="#/cursos">Ver cursos →</a><a class="btn lg o" href="#niveis" onclick="document.getElementById('niveis').scrollIntoView();return false">Descobrir meu nível</a></p></div><img src="${HERO}" width="1280" height="960" alt="Mesa de trabalho com esboços de telas de celular, um mapa de jornada feito com post-its e um notebook aberto em uma ferramenta de design."></section></div>
<section class="band" aria-label="Vantagens da compra"><ul class="w"><li>✓ Acesso liberado na hora</li><li>✓ Pix ou cartão</li><li>✓ Certificado de conclusão</li></ul></section>

<section class="s" aria-labelledby="ct"><div class="w"><h2 id="ct" class="h">Cursos em destaque</h2><p class="mut">Preço único, sem mensalidade.</p><ul class="grid g2 mt2" style="list-style:none;padding:0">${C.map(c=>`<li>${card(c)}</li>`).join("")}</ul></div></section>
<section class="s sec" aria-labelledby="ft"><div class="w"><h2 id="ft" class="h">O que você encontra em todos os cursos</h2>${cards(DIF,x=>`<h3>${x[0]}</h3><p class="mut" style="margin:0">${x[1]}</p>`,"g3")}</div></section>
<section class="s" aria-labelledby="cm"><div class="w"><h2 id="cm" class="h">Como funciona</h2><ol class="grid g2 mt2" style="list-style:none;padding:0">${[["Escolha pelo seu nível","Cada curso diz para quem é e o que você precisa saber antes."],["Compre em poucos passos","Crie sua conta e pague com Pix ou cartão. O acesso é liberado na hora."],["Assista no seu ritmo","Aulas de até 15 minutos, com resumo e um exercício."],["Receba seu certificado","Ao concluir todas as aulas, emita o certificado e salve em PDF."]].map((x,i)=>`<li class="card"><span class="mut b" style="font-size:.9rem">Passo ${i+1}</span><h3>${x[0]}</h3><p class="mut" style="margin:0">${x[1]}</p></li>`).join("")}</ol></div></section>
<section class="s sec" aria-labelledby="qt"><div class="w" style="max-width:48rem"><h2 id="qt" class="h">Perguntas frequentes</h2>${faq([FQ[0],FQ[2],FQ[4]])}<p><a href="#/ajuda">Ver todas as perguntas</a></p></div></section>
<div class="w" style="padding-block:3rem 4rem"><div class="cta"><div><h2 class="h">Comece pela primeira aula hoje</h2><p style="margin:.5rem 0 0;opacity:.9">Escolha o curso do seu nível e estude no seu ritmo.</p></div><a class="btn s lg" href="#/cursos">Ver cursos</a></div></div>`,

cursos:(r)=>{const f=r[1]||"todos";const A=C.filter(c=>f=="todos"||c.l==f);return`<div class="w" style="padding-block:2rem 3rem">${crumb(["Cursos"])}<h1 class="d mt">Cursos de UX</h1><p class="mut mt">Escolha pelo seu nível. Todos têm certificado de conclusão.</p><div class="tabs" role="group" aria-label="Filtrar por nível">${["todos",...Object.keys(LV)].map(k=>`<button aria-pressed="${k==f}" onclick="location.hash='#/cursos/f/${k}'">${k=="todos"?"Todos":LV[k]}</button>`).join("")}</div><ul class="grid g2 mt2" style="list-style:none;padding:0">${A.map(c=>`<li>${card(c)}</li>`).join("")}</ul></div>`},

curso:(r)=>{const c=C.find(x=>x.s==r[1]);if(!c)return nf();const has=enr.includes(c.s),n=L(c).length,d=done(c).length;let k=0;return`<div class="n" style="max-width:56rem">${crumb(['<a href="#/cursos">Cursos</a>',c.t])}<p class="mt">${lv(c.l)}</p><h1 class="d mt">${c.t}</h1><p class="mut mt" style="font-size:1.125rem">${c.r}</p><p class="b big">${info(c)} (aulas e exercícios)</p>
<div class="card mt2"><p style="margin:0;font-size:1.5rem" class="b">${brl(c.p)} <span class="mut" style="font-size:1rem;font-weight:400">pagamento único, sem mensalidade</span></p>${has?`<a class="btn lg mt" href="#/aula/${c.s}/${nx(c)}">${d==n?"Rever aulas":d?"Continuar curso":"Começar curso"}</a>`:`<a class="btn lg mt" href="#/checkout/${c.s}">Comprar agora</a>`}</div>
<h2 class="h mt2">Sobre o curso</h2><p class="big">${c.d}</p><h2 class="h mt2">Para quem é</h2><p class="big">${c.w}</p>
<h2 class="h mt2">O que você vai aprender</h2><ul class="p big">${c.o.map(x=>`<li>${x}</li>`).join("")}</ul>
<h2 class="h mt2">Conteúdo</h2>${c.m.map((m,i)=>`<h3 class="mt" style="font-size:1.25rem">Módulo ${i+1}: ${m[0]}</h3><ol class="p big" start="${k+1}">${m[1].map(a=>{k++;return`<li>${a[0]} <span class="mut">(${a[1]} min)</span></li>`}).join("")}</ol>`).join("")}
<h2 class="h mt2">Pré-requisitos</h2><p class="big">${c.pr}</p><div class="box in"><strong>Certificado:</strong> ao concluir todas as aulas, você emite o certificado de conclusão.</div></div>`},

aula:(r)=>{const c=C.find(x=>x.s==r[1]),A=c&&L(c),i=(+r[2]||0)-1;if(!c||!A[i])return nf();
if(!user)return gate("Entre para assistir","Entre na sua conta para acessar as aulas.","#/aula/"+c.s+"/"+(i+1));
if(!enr.includes(c.s))return`<div class="n"><h1 class="d" style="font-size:2rem">Você ainda não tem este curso</h1><p>Para assistir às aulas de <strong>${c.t}</strong>, faça a compra.</p><a class="btn lg" href="#/cursos/${c.s}">Ver o curso</a></div>`;
const d=done(c),ok=d.includes(i),a=A[i].a;return`<div class="n" style="max-width:56rem">${crumb(['<a href="#/meus-cursos">Meus cursos</a>','<a href="#/cursos/'+c.s+'">'+c.t+"</a>","Aula "+(i+1)])}
<p class="mut b mt" style="margin-bottom:0">Módulo ${A[i].mi+1}: ${A[i].mod} · ${a[1]} min</p><h1 class="d" style="font-size:2rem;margin-top:.25rem">${a[0]}</h1>${bar(c,A.length,d.length)}<p class="mut" style="font-size:1rem;margin:.5rem 0 0">${d.length} de ${A.length} aulas concluídas</p><div id="st" role="status"></div>
<h2 class="h mt2">Resumo da aula</h2>${a[2].split("||").map(x=>`<p class="big">${x}</p>`).join("")}<div class="box in"><strong>Exercício:</strong> ${a[3]}</div>
<p class="mt2" style="display:flex;gap:.75rem;flex-wrap:wrap;align-items:center">${ok?'<span class="box ok" style="margin:0">✓ Aula concluída</span><button class="btn o" id="dn">Desfazer conclusão</button>':'<button class="btn lg" id="dn">Concluir aula</button>'}</p>
${d.length==A.length?`<div class="box ok"><strong>Curso concluído!</strong> <a href="#/certificado/${c.s}">Emitir certificado</a></div>`:""}
<p class="mt2" style="display:flex;justify-content:space-between;gap:.75rem;flex-wrap:wrap">${i>0?`<a class="btn o" href="#/aula/${c.s}/${i}">← Aula anterior</a>`:"<span></span>"}${i<A.length-1?`<a class="btn o" href="#/aula/${c.s}/${i+2}">Próxima aula →</a>`:""}</p>
<h2 class="h mt2">Aulas do curso</h2><ol class="p">${A.map((y,j)=>`<li>${d.includes(j)?"✓ ":""}${j==i?`<strong aria-current="page">${y.a[0]}</strong>`:`<a href="#/aula/${c.s}/${j+1}">${y.a[0]}</a>`}</li>`).join("")}</ol></div>`},

certificado:(r)=>{const c=C.find(x=>x.s==r[1]);if(!c)return nf();if(!user)return gate("Entre para ver o certificado","Entre na sua conta para emitir seu certificado.","#/certificado/"+c.s);
const p=PR();if(!enr.includes(c.s)||done(c).length<L(c).length)return`<div class="n"><h1 class="d" style="font-size:2rem">Certificado ainda não disponível</h1><p>Conclua todas as aulas de <strong>${c.t}</strong> para emitir o certificado.</p><a class="btn lg" href="#/meus-cursos">Voltar para Meus cursos</a></div>`;
let h=0;for(const ch of user.em+c.s)h=(h*31+ch.charCodeAt(0))>>>0;const dt=new Date(p[c.s+"d"]||Date.now()).toLocaleDateString("pt-BR",{dateStyle:"long"});
return`<div class="n" style="max-width:56rem"><div class="np">${crumb(['<a href="#/meus-cursos">Meus cursos</a>',"Certificado"])}</div><article class="cert" aria-label="Certificado de conclusão"><p class="mut b" style="margin:0">Nexo Design</p><h1 class="d mt">Certificado de conclusão</h1><p class="mt2" style="margin:0">Certificamos que</p><p class="nm">${esc(user.nm)}</p><p style="margin:0">concluiu o curso</p><h2 class="h mt">${c.t}</h2><p>com carga horária de ${hrs(c)} horas, em ${dt}.</p><p class="mut" style="font-size:.9rem;margin:2rem 0 0">Código de verificação: NX-${h.toString(36).toUpperCase().padStart(7,"0")}</p></article><p class="mt2 np" style="display:flex;gap:.75rem;flex-wrap:wrap"><button class="btn lg" onclick="print()">Imprimir ou salvar em PDF</button><a class="btn o lg" href="#/meus-cursos">Voltar</a></p></div>`},

sobre:()=>`<div class="n" style="max-width:56rem">${crumb(["Sobre"])}<h1 class="d mt">Aprender UX no seu ritmo</h1><p class="mut mt" style="font-size:1.125rem;max-width:40rem">O Nexo Design reúne cursos de UX em português para quem está começando e para quem quer se aprofundar, sempre com aulas curtas e linguagem simples.</p>
<h2 class="h mt2">No que acreditamos</h2>${cards([["Clareza primeiro","Explicamos cada termo antes de usá-lo e damos exemplos do dia a dia."],["Aprender aos poucos","Aulas de até 15 minutos, com um exercício para fixar o conteúdo."],["Acessível para todos","Ensinamos e aplicamos as regras de acessibilidade da WCAG neste próprio site."]],x=>`<h3>${x[0]}</h3><p class="mut" style="margin:0">${x[1]}</p>`)}
<h2 class="h mt2">Como organizamos o aprendizado: o Double Diamond</h2><p class="mut">O Double Diamond (Duplo Diamante) é um método de quatro fases usado por times de UX. Os cursos seguem essa mesma ordem.</p><ol class="grid g2 mt" style="list-style:none;padding:0">${[["Descobrir","Pesquisar e entender as pessoas."],["Definir","Transformar o que descobriu em um problema claro."],["Desenvolver","Criar e testar ideias de solução."],["Entregar","Medir os resultados e melhorar."]].map((x,i)=>`<li class="card" style="background:var(--sec)"><strong style="font-size:1.125rem">${i+1}. ${x[0]}</strong><br>${x[1]}</li>`).join("")}</ol>
<p class="mt2"><a href="#/ux">Veja como aplicamos UX neste site</a></p><a class="btn lg mt" href="#/cursos">Ver cursos</a></div>`,

ajuda:()=>`<div class="n">${crumb(["Ajuda"])}<h1 class="d mt">Como podemos ajudar?</h1><p class="mut mt" style="font-size:1.125rem">As dúvidas mais comuns, separadas por assunto.</p>${G.map(g=>`<section class="mt2"><h2 class="h">${g[0]}</h2>${faq(g[1])}</section>`).join("")}<section class="box in mt2" style="padding:1.5rem"><h2 class="h">Não achou sua resposta?</h2><p>Escreva para a gente. Respondemos em até 1 dia útil.</p><a class="b" href="mailto:contato@nexodesign.com.br">✉ contato@nexodesign.com.br</a></section></div>`,

ux:()=>{const T=(h,rows)=>`<table style="width:100%;border-collapse:collapse;margin-top:1rem"><caption class="b" style="text-align:left;padding-bottom:.5rem">${h}</caption>${rows.map(x=>`<tr style="border-top:1px solid var(--bd)"><th scope="row" style="text-align:left;vertical-align:top;padding:.6rem .75rem .6rem 0;width:34%">${x[0]}</th><td style="padding:.6rem 0">${x[1]}</td></tr>`).join("")}</table>`;
return`<div class="n" style="max-width:56rem">${crumb(["Como aplicamos UX"])}<h1 class="d mt">Como aplicamos UX neste site</h1><p class="mut mt" style="font-size:1.125rem">Um resumo de onde as etapas do Duplo Diamante e as heurísticas de Nielsen aparecem na interface.</p>
<h2 class="h mt2">1. Descobrir: quem procura um curso de UX?</h2><p>Público-alvo: futuros estudantes de UX. Organizamos o que a equipe sabe, supõe e ainda não sabe na matriz CSD.</p>
<ul class="grid g3 mt" style="list-style:none;padding:0">${[["Certezas","O público quer aprender UX online. Antes de comprar, precisa saber conteúdo, nível, pré-requisitos e preço."],["Suposições","Iniciantes não sabem qual curso escolher. Muitos desistem se o preço ou o conteúdo não estiver claro. Quase todos têm pouco tempo para estudar."],["Dúvidas","Qual é o principal motivo para desistir da compra? O público entende termos como wireframe e persona sem explicação?"]].map(x=>`<li class="card"><h3>${x[0]}</h3><p class="mut" style="margin:0">${x[1]}</p></li>`).join("")}</ul>
<div class="card mt2" style="background:var(--sec)"><h3>Proto-persona: Marina, 27 anos</h3><p>Assistente administrativa que quer migrar para UX. Estuda à noite e pelo celular.</p><p style="margin:0"><strong>Dores:</strong> não sabe por onde começar, tem pouco tempo, teme termos técnicos e receia pagar por algo que não vai gostar.<br><strong>Objetivos:</strong> escolher um curso do seu nível, estudar em partes curtas e ter um certificado.</p><p class="mut" style="font-size:.9rem;margin:.75rem 0 0">Criada a partir das suposições da equipe, ainda sem entrevistas com usuários.</p></div>
<h2 class="h mt2">2. Definir: o problema e a proposta de valor</h2><p><strong>Problema:</strong> como ajudar quem está começando a escolher o curso certo e comprar com segurança?</p><p><strong>Proposta de valor:</strong> cursos claros, aulas curtas, linguagem simples e certificado de conclusão.</p>${T("Onde aparece no site",[["Dores do público","Seção “Você se identifica?” na página inicial."],["Escolha pelo nível","Seção “Qual é o seu nível?” e filtro na página Cursos."],["Módulos, pré-requisitos e preço","Página de cada curso."],["Diferenciais","Seção “O que você encontra em todos os cursos”."]])}
<h2 class="h mt2">3. Desenvolver: o fluxo principal</h2><p><strong>Caminho feliz:</strong> Início → Curso → Entrar ou criar conta → Pagamento → Confirmação → Aulas → Certificado.</p><p><strong>Caminhos de erro:</strong> campo inválido, senha incorreta, esqueci a senha, cartão recusado e curso ainda sem acesso. Cada um tem uma mensagem que explica o problema e indica o que fazer.</p>
<h2 class="h mt2">4. Entregar: como vamos validar</h2><p>Próximo passo: observar 5 pessoas parecidas com a Marina tentando comprar um curso, medir a taxa de sucesso e o tempo da tarefa, e corrigir os problemas mais graves primeiro.</p>
<h2 class="h mt2">Heurísticas de Nielsen</h2>${T("Onde cada uma aparece",[["1. Visibilidade do status do sistema","Etapas da compra, botão “Processando pagamento…”, barra de progresso nas aulas e aviso de aula concluída."],["2. Correspondência com o mundo real","Linguagem simples, termos técnicos explicados e rótulos conhecidos, como “Entrar”, “Comprar agora” e “Meus cursos”."],["3. Controle e liberdade","Sair da conta, voltar pela trilha de navegação, desfazer a conclusão de uma aula e trocar a forma de pagamento."],["4. Consistência e padrões","Mesmas cores, fontes e botões em todas as páginas, com um botão principal por tela."],["5. Prevenção de erros","Máscara no cartão e na validade, regras da senha visíveis antes de digitar e confirmação do que será comprado."],["6. Reconhecer em vez de lembrar","Trilha de navegação, menu fixo no topo, lista de aulas ao lado da aula e curso em andamento em Meus cursos."],["7. Flexibilidade e eficiência","Escolha por nível, filtro ou menu; link para pular ao conteúdo; botão para mostrar a senha."],["8. Design minimalista","Textos curtos, uma ação principal por tela e seções bem separadas."],["9. Ajudar a recuperar de erros","Mensagens como “Cartão recusado. Nenhum valor foi cobrado. Tente outro cartão ou pague com Pix.”"],["10. Ajuda e documentação","Página de Ajuda por assunto e perguntas frequentes na página inicial."]])}
<a class="btn lg mt2" href="#/cursos">Ver cursos</a></div>`},

entrar:()=>`<div class="n" style="max-width:28rem">${crumb(["Entrar"])}<h1 class="d mt" style="font-size:2rem">Entrar ou criar conta</h1><div id="f"></div></div>`,

if(enr.includes(c.s))return`<div class="n"><h1 class="d" style="font-size:2rem">Você já tem este curso</h1><a class="btn lg" href="#/aula/${c.s}/${nx(c)}">Ir para as aulas</a></div>`;
return`<div class="n">${crumb(['<a href="#/cursos/'+c.s+'">'+c.t+"</a>","Pagamento"])}<ol class="steps" aria-label="Etapas da compra"><li>1. Conta ✓</li><li aria-current="step">2. Pagamento</li><li>3. Confirmação</li></ol><h1 class="d" style="font-size:2rem">Pagamento</h1><div class="card mt"><strong>${c.t}</strong><br><span class="mut">${info(c)}</span><p class="b" style="font-size:1.25rem;margin:.5rem 0 0">${brl(c.p)}</p></div><div id="pay"></div></div>`},

"meus-cursos":()=>{if(!user)return gate("Meus cursos","Entre na sua conta para ver seus cursos.","#/meus-cursos");const A=C.filter(c=>enr.includes(c.s)),p=PR();return`<div class="n" style="max-width:56rem">${crumb(["Meus cursos"])}<h1 class="d mt" style="font-size:2.25rem">Meus cursos</h1>${A.length?`<ul class="grid g2 mt2" style="list-style:none;padding:0">${A.map(c=>{const n=L(c).length,d=done(c).length;return`<li class="card">${lv(c.l)}<h3>${c.t}</h3><p class="mut" style="margin:0">${d} de ${n} aulas concluídas</p>${bar(c,n,d)}<p class="mt" style="display:flex;gap:.5rem;flex-wrap:wrap"><a class="btn" href="#/aula/${c.s}/${nx(c)}">${d==n?"Rever aulas":d?"Continuar":"Começar"}</a>${d==n?`<a class="btn o" href="#/certificado/${c.s}">Ver certificado</a>`:""}</p></li>`}).join("")}</ul>`:`<p class="mut mt">Você ainda não tem cursos.</p><a class="btn lg mt" href="#/cursos">Ver cursos</a>`}</div>`}
};
function nf(){return`<div class="n"><h1 class="d">Página não encontrada</h1><p>O endereço não existe. <a href="#/">Voltar ao início</a>.</p></div>`}

function authForm(){const f=$("#f");let mode="in",er={};
const draw=(v={})=>{f.innerHTML=`<div class="tabs" role="group" aria-label="Tipo de acesso"><button aria-pressed="${mode=="in"}" data-m="in">Entrar</button><button aria-pressed="${mode=="up"}" data-m="up">Criar conta</button></div><form novalidate>${mode=="up"?`<label for="nm">Nome</label><input id="nm" autocomplete="name" value="${esc(v.nm||"")}" ${er.nm?'aria-invalid="true"':""}>${bad("nm",er.nm)}`:""}<label for="em">E-mail</label><input id="em" type="email" autocomplete="email" value="${esc(v.em||"")}" ${er.em?'aria-invalid="true"':""}>${bad("em",er.em)}<label for="pw">Senha ${mode=="up"?'<span class="mut" style="font-weight:400">(mínimo 8 caracteres)</span>':""}</label><div style="position:relative"><input id="pw" type="password" style="padding-right:6rem" autocomplete="${mode=="up"?"new":"current"}-password" ${er.pw?'aria-invalid="true"':""}><button type="button" id="sp" class="btn g" aria-label="Mostrar senha" style="position:absolute;right:2px;top:0;padding:0 .75rem">Mostrar</button></div>${bad("pw",er.pw)}${mode=="in"?'<p style="margin:.5rem 0 0"><a href="#/recuperar">Esqueci minha senha</a></p>':""}<button class="btn lg mt2" style="width:100%">${mode=="in"?"Entrar":"Criar conta"}</button></form>`;
f.querySelector("#sp").onclick=e=>{const i=f.querySelector("#pw"),h=i.type=="password";i.type=h?"text":"password";e.currentTarget.textContent=h?"Ocultar":"Mostrar";e.currentTarget.setAttribute("aria-label",h?"Ocultar senha":"Mostrar senha")};
f.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{mode=b.dataset.m;er={};draw()});
f.querySelector("form").onsubmit=e=>{e.preventDefault();const g=i=>(f.querySelector("#"+i)||{}).value?.trim()||"",v={nm:g("nm"),em:g("em"),pw:f.querySelector("#pw").value};er={};
if(mode=="up"&&!v.nm)er.nm="Digite seu nome.";if(!/^\S+@\S+\.\S+$/.test(v.em))er.em="Digite um e-mail válido, como nome@email.com.";if(v.pw.length<(mode=="up"?8:1))er.pw=mode=="up"?"A senha precisa ter pelo menos 8 caracteres.":"Digite sua senha.";
if(!Object.keys(er).length){const U=ld("nx_users",{});if(mode=="up"){if(U[v.em])er.em="Este e-mail já tem conta. Use a aba Entrar.";else{U[v.em]={nm:v.nm,pw:v.pw};sv("nx_users",U)}}else if(!U[v.em]||U[v.em].pw!==v.pw)er.pw="E-mail ou senha incorretos. Confira e tente de novo."}
if(Object.keys(er).length){draw(v);const x=f.querySelector("[aria-invalid=true]");x&&x.focus();return}
const U=ld("nx_users",{});user={em:v.em,nm:U[v.em].nm};sv("nx_user",user);enr=ld("nx_enr_"+v.em,[]);sv("nx_enr",enr);const n=sessionStorage.getItem("nx_next");sessionStorage.removeItem("nx_next");location.hash=n||"#/meus-cursos"}};draw()}

const okMail=e=>/^\S+@\S+\.\S+$/.test(e);
function recForm(){const f=$("#rf");f.onsubmit=e=>{e.preventDefault();const em=$("#re").value.trim(),bd=!okMail(em);
$("#re-w").innerHTML=bad("re",bd?"Digite um e-mail válido, como nome@email.com.":"");$("#re").setAttribute("aria-invalid",bd);if(bd){$("#re").focus();return}
if(ld("nx_users",{})[em]){const t=Array.from(crypto.getRandomValues(new Uint8Array(16)),x=>x.toString(16).padStart(2,"0")).join(""),R=ld("nx_rt",{});for(const k in R)if(R[k].exp<Date.now())delete R[k];R[t]={em,exp:Date.now()+30*60*1000};sv("nx_rt",R);console.info("Link de redefinição de senha: "+location.href.split("#")[0]+"#/redefinir-senha/"+t)}
f.hidden=true;$("#rm").innerHTML=`<div class="box ok"><strong>Link enviado!</strong><p style="margin:.5rem 0 0">Enviamos um link para redefinir a senha para <strong>${esc(em)}</strong>. Confira sua caixa de entrada e a pasta de spam. O link vale por 30 minutos.</p></div><p><a href="#/entrar">Voltar para Entrar</a></p>`}}

function newPass(r){const f=$("#nf");if(!f)return;$("#sp").onclick=e=>{const i=$("#pn"),h=i.type=="password";i.type=h?"text":"password";e.currentTarget.textContent=h?"Ocultar":"Mostrar";e.currentTarget.setAttribute("aria-label",h?"Ocultar senha":"Mostrar senha")};
f.onsubmit=e=>{e.preventDefault();const pw=$("#pn").value,R=ld("nx_rt",{}),t=R[r[1]],U=ld("nx_users",{});
if(!t||t.exp<Date.now()||!U[t.em]){render();return}const b=pw.length<8?"A senha precisa ter pelo menos 8 caracteres.":"";$("#pn-w").innerHTML=bad("pn",b);$("#pn").setAttribute("aria-invalid",!!b);if(b){$("#pn").focus();return}
U[t.em].pw=pw;sv("nx_users",U);delete R[r[1]];sv("nx_rt",R);f.hidden=true;$("#rm").innerHTML='<div class="box ok"><strong>Senha alterada!</strong> <a href="#/entrar">Entrar com a nova senha</a></div>'}}

function payForm(slug){const p=$("#pay");let m="pix";
const fin=()=>{if(!enr.includes(slug))enr.push(slug);sv("nx_enr",enr);sv("nx_enr_"+user.em,enr);location.hash="#/confirmacao/"+slug};
const wait=(b,fail)=>{b.disabled=true;b.textContent="Processando pagamento…";setTimeout(()=>fail?draw(fail):fin(),1400)};
const pix=()=>{p.innerHTML=`<h2 class="h mt2">Pague com Pix</h2><p>Copie o código abaixo e cole no app do seu banco, na opção Pix copia e cola.</p><code id="pc">00020126360014BR.GOV.BCB.PIX0114nexodesign00015204000053039865802BR5909NEXODESIGN6009SAO PAULO6304A1B2</code><p class="mt" style="display:flex;gap:.75rem;flex-wrap:wrap"><button class="btn o" id="cp">Copiar código</button><button class="btn" id="pg">Já fiz o pagamento</button><button class="btn g" id="vl">Voltar</button></p><div id="msg" role="status"></div>`;
$("#cp").onclick=async()=>{try{await navigator.clipboard.writeText($("#pc").textContent);$("#msg").innerHTML='<div class="box ok">Código copiado.</div>'}catch{$("#msg").innerHTML='<div class="box in">Não foi possível copiar. Selecione o código e copie manualmente.</div>'}};
$("#pg").onclick=e=>{$("#msg").innerHTML="Confirmando o pagamento…";wait(e.currentTarget)};$("#vl").onclick=()=>draw()};
const draw=(msg="")=>{p.innerHTML=`<form novalidate><fieldset style="border:0;padding:0;margin:1rem 0 0"><legend class="b">Forma de pagamento</legend><label class="opt"><input type="radio" name="m" value="pix" ${m=="pix"?"checked":""}> Pix (aprovação na hora)</label><label class="opt"><input type="radio" name="m" value="cc" ${m=="cc"?"checked":""}> Cartão de crédito</label></fieldset>${m=="cc"?`<label for="cn">Número do cartão</label><input id="cn" inputmode="numeric" autocomplete="cc-number" placeholder="0000 0000 0000 0000" maxlength="23"><label for="cv">Validade (MM/AA)</label><input id="cv" inputmode="numeric" autocomplete="cc-exp" placeholder="12/30" maxlength="5">`:`<p class="mut">Ao continuar, mostramos o código Pix para você copiar.</p>`}<div id="msg" role="alert">${msg}</div><button class="btn lg mt2" style="width:100%">${m=="pix"?"Gerar código Pix":"Confirmar pagamento"}</button></form>`;
p.querySelectorAll("[name=m]").forEach(r=>r.onchange=()=>{m=r.value;draw()});
if(m=="cc"){$("#cn").oninput=e=>e.target.value=e.target.value.replace(/\D/g,"").slice(0,19).replace(/(.{4})/g,"$1 ").trim();$("#cv").oninput=e=>{let v=e.target.value.replace(/\D/g,"").slice(0,4);e.target.value=v.length>2?v.slice(0,2)+"/"+v.slice(2):v}}
p.querySelector("form").onsubmit=e=>{e.preventDefault();if(m=="pix")return pix();const n=$("#cn").value.replace(/\D/g,""),v=$("#cv").value;if(n.length<13||!/^\d\d\/\d\d$/.test(v))return draw('<div class="box er">Confira o número do cartão (13 a 19 dígitos) e a validade (MM/AA).</div>');
wait(e.submitter||p.querySelector("button.lg"),n.endsWith("0000")?'<div class="box er">Cartão recusado. Nenhum valor foi cobrado. Tente outro cartão ou pague com Pix.</div>':"")}};draw()}

function lessonBind(r){const c=C.find(x=>x.s==r[1]),b=$("#dn");if(!c||!b)return;const i=+r[2]-1,n=L(c).length;b.onclick=()=>{const p=PR(),d=p[c.s]||[],k=d.indexOf(i);if(k<0)d.push(i);else d.splice(k,1);p[c.s]=d;if(d.length==n)p[c.s+"d"]=p[c.s+"d"]||new Date().toISOString();sv("nx_pr_"+user.em,p);
flash=k>=0?"Conclusão desfeita.":d.length==n?"Parabéns! Você concluiu todas as aulas. Seu certificado está disponível.":"Aula concluída! Faltam "+(n-d.length)+".";render(true)}}

function render(keep){let r=location.hash.replace(/^#\/?/,"").split("/").filter(Boolean);let k=r[0]||"";
if(k=="confirmacao"){const c=C.find(x=>x.s==r[1]);$("#main").innerHTML=c?`<div class="n"><ol class="steps" aria-label="Etapas da compra"><li>1. Conta ✓</li><li>2. Pagamento ✓</li><li aria-current="step">3. Confirmação</li></ol><div class="box ok" role="status"><h1 class="h">Pagamento aprovado!</h1><p style="margin:.5rem 0 0">Seu acesso a <strong>${c.t}</strong> já está liberado.</p></div><a class="btn lg mt2" href="#/aula/${c.s}/1">Começar a primeira aula</a> <a class="btn o lg mt2" href="#/meus-cursos">Ir para Meus cursos</a></div>`:nf()}
else{if(k=="cursos"&&r[1]=="f")r=["cursos",r[2]];else if(k=="cursos"&&r[1])k="curso";$("#main").innerHTML=(V[k]||nf)(r)}
nav(r);document.title="Nexo Design — "+(k==""?"Cursos online de UX":k=="curso"||k=="aula"?(C.find(x=>x.s==r[1])||{t:"Cursos"}).t:k=="ux"?"Como aplicamos UX":"Cursos de UX");
if(k=="entrar")authForm();if(k=="recuperar")recForm();if(k=="redefinir-senha")newPass(r);if(k=="checkout"&&user&&!enr.includes(r[1])&&C.find(x=>x.s==r[1]))payForm(r[1]);if(k=="aula")lessonBind(r);
if(flash&&$("#st")){$("#st").innerHTML='<div class="box ok">'+flash+"</div>"}flash="";
if(keep!==true)scrollTo(0,0)}
addEventListener("hashchange",()=>render());render();
</script>
</body>
</html>
